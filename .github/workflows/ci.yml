        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm public:audit
      - run: pnpm check
      - name: Block known vulnerabilities in production dependencies
        run: pnpm audit --prod --audit-level=low
      - name: Block high and critical vulnerabilities in build tooling
        run: pnpm audit --audit-level=high
